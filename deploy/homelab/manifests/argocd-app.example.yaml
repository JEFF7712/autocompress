# Copy into homelab repo as apps/autocompress.yaml once the manifests have
# been validated against the live cluster (they are UNTESTED drafts until
# then), with manifests copied to infrastructure/autocompress/.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: autocompress
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://gitlab.com/JEFF7712/homelab.git"
    targetRevision: main
    path: infrastructure/autocompress
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: autocompress
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
